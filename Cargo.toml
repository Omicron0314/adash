[workspace]
resolver = "3"
members = [
    "crates/ucloud-api",
    "crates/adash-core",
    "crates/adash-tool",
    "crates/pi-rpc",
    "crates/adash-app",
]
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
ucloud-api = { path = "crates/ucloud-api" }
adash-core = { path = "crates/adash-core" }
pi-rpc = { path = "crates/pi-rpc" }

# UI: must match the submodule's pinned GPUI/Base/Kit (see its Cargo.toml).
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", branch = "main" }
gpui-kit-material = { path = "third_party/gpui-kit-material/crates/material" }
gpui-base = { version = "=0.8.1" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-fast]
opt-level = 3

# Engine patches required by gpui-kit-material until they land upstream.
# Keep in sync with third_party/gpui-kit-material/Cargo.toml.
[patch.crates-io]
gpui-fast-macos = { path = "third_party/gpui-kit-material/vendor/gpui-fast-macos" }
gpui-pre-macos = { path = "third_party/gpui-kit-material/vendor/gpui-pre-macos" }
gpui-fast = { path = "third_party/gpui-kit-material/vendor/gpui-fast" }
gpui-fast-web = { path = "third_party/gpui-kit-material/vendor/gpui-fast-web" }
gpui-fast-apple = { path = "third_party/gpui-kit-material/vendor/gpui-fast-apple" }
gpui-base = { path = "third_party/gpui-kit-material/vendor/gpui-base" }
gpui-pre = { path = "third_party/gpui-kit-material/vendor/gpui-pre" }
gpui-pre-web = { path = "third_party/gpui-kit-material/vendor/gpui-pre-web" }
gpui-pre-apple = { path = "third_party/gpui-kit-material/vendor/gpui-pre-apple" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-kit = { path = "third_party/gpui-kit-material/vendor/gpui-kit" }
gpui-base = { path = "third_party/gpui-kit-material/vendor/gpui-base" }
